services:
  patient-service-db:
    image: postgres:17-alpine
    container_name: patient-service-db
    networks:
      - patient-management-network
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: patient_user
      POSTGRES_PASSWORD: patient_password
    ports:
      - "5400:5432"
    volumes:
      - "./volumes/patient-service-db:/var/lib/postgresql"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  billing-service-db:
    image: postgres:17-alpine
    container_name: billing-service-db
    networks:
      - patient-management-network
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
    ports:
      - "5401:5432"
    volumes:
      - "./volumes/billing-service-db:/var/lib/postgresql"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    networks:
      - patient-management-network
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    image: billing-service:latest
    container_name: billing-service
    networks:
      - patient-management-network
    depends_on:
      billing-service-db:
        condition: service_healthy
    environment:
      DB_HOST: billing-service-db
      DB_PORT: 5432
      DB_NAME: billing_db
      DB_USERNAME: billing_user
      DB_PASSWORD: billing_password
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9090" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    image: patient-service:latest
    container_name: patient-service
    networks:
      - patient-management-network
    depends_on:
      patient-service-db:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: patient-service-db
      DB_PORT: 5432
      DB_NAME: patient_db
      DB_USERNAME: patient_user
      DB_PASSWORD: patient_password
      SPRING_PROFILES_ACTIVE: dev
      BILLING_SERVICE_HOST: billing-service
      BILLING_SERVICE_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    image: analytics-service:latest
    container_name: analytics-service
    networks:
      - patient-management-network
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092


networks:
  patient-management-network:
    name: patient-management-network
    driver: bridge

volumes:
  kafka-data:
