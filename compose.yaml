services:
  patient-service-db:
    image: postgres:17-alpine
    container_name: patient-service-db
    networks:
      - patient-management-network
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: patient_user
      POSTGRES_PASSWORD: patient_password
    ports:
      - "5400:5432"
    volumes:
      - ./volumes/patient-service-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  billing-service-db:
    image: postgres:17-alpine
    container_name: billing-service-db
    networks:
      - patient-management-network
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
    ports:
      - "5401:5432"
    volumes:
      - ./volumes/billing-service-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    image: billing-service:latest
    container_name: billing-service
    networks:
      - patient-management-network
    depends_on:
      billing-service-db:
        condition: service_healthy
    environment:
      DB_HOST: billing-service-db
      DB_PORT: 5432
      DB_NAME: billing_db
      DB_USERNAME: billing_user
      DB_PASSWORD: billing_password
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9090" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    image: patient-service:latest
    container_name: patient-service
    networks:
      - patient-management-network
    depends_on:
      patient-service-db:
        condition: service_healthy
      billing-service:
        condition: service_healthy
    environment:
      DB_HOST: patient-service-db
      DB_PORT: 5432
      DB_NAME: patient_db
      DB_USERNAME: patient_user
      DB_PASSWORD: patient_password
      SPRING_PROFILES_ACTIVE: dev
      BILLING_SERVICE_HOST: billing-service
      BILLING_SERVICE_PORT: 9090
    ports:
      - "8081:8081"


networks:
  patient-management-network:
    name: patient-management-network
    driver: bridge
