spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5401}/${DB_NAME:billing_db}
    username: ${DB_USERNAME:billing_user}
    password: ${DB_PASSWORD:billing_password}
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.patientmanagement.billingservice: DEBUG
    org.hibernate.SQL: DEBUG
