spring:
  application:
    name: patient-service

  profiles:
    active:
      - dev

  jpa:
    open-in-view: false
  grpc:
    client:
      channel:
        billing:
          target: dns:///${BILLING_SERVICE_HOST:localhost}:${BILLING_SERVICE_PORT:9090}
          default:
            load-balancing-policy: pick_first
          idle:
            timeout: 1h


server:
  port: 8081

logging:
  level:
    root: info