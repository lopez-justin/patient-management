spring:
  application:
    name: patient-service

  profiles:
    active:
      - dev

  jpa:
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
  grpc:
    client:
      channel:
        billing:
          target: dns:///${BILLING_SERVICE_HOST:localhost}:${BILLING_SERVICE_PORT:9090}
          default:
            load-balancing-policy: pick_first
          idle:
            timeout: 1h

app:
  kafka:
    topics:
      patient-created: patient.created.v1

server:
  port: 8081

logging:
  level:
    root: info