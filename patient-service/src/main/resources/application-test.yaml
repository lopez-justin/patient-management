spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:patientdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    admin:
      auto-create: false

management:
  health:
    kafka:
      enabled: false


logging:
  level:
    com.patientmanagement.patientservice: DEBUG
    org.hibernate.SQL: DEBUG
